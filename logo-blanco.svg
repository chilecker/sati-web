<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <rect x="4" y="4" width="392" height="392" rx="56" fill="#ffffff"/>
  <rect x="4" y="4" width="392" height="392" rx="56" fill="none" stroke="#dbeafe" stroke-width="2"/>

  <!-- Chip icon -->
  <g transform="translate(148,54)" stroke-linecap="round" fill="none">
    <g stroke="#1d4ed8" stroke-width="7">
      <line x1="26" y1="0" x2="26" y2="16"/>
      <line x1="52" y1="0" x2="52" y2="16"/>
      <line x1="78" y1="0" x2="78" y2="16"/>

      <line x1="26" y1="104" x2="26" y2="120"/>
      <line x1="52" y1="104" x2="52" y2="120"/>
      <line x1="78" y1="104" x2="78" y2="120"/>

      <line x1="0" y1="26" x2="16" y2="26"/>
      <line x1="0" y1="52" x2="16" y2="52"/>
      <line x1="0" y1="78" x2="16" y2="78"/>

      <line x1="104" y1="26" x2="120" y2="26"/>
      <line x1="104" y1="52" x2="120" y2="52"/>
      <line x1="104" y1="78" x2="120" y2="78"/>
    </g>

    <!-- chip body -->
    <rect x="16" y="16" width="88" height="88" rx="10" fill="#ffffff" stroke="#1d4ed8" stroke-width="7"/>
    <rect x="34" y="34" width="52" height="52" rx="6" stroke="#1d4ed8" stroke-width="7"/>
  </g>

  <!-- Wordmark -->
  <text x="200" y="252" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="72" letter-spacing="4" fill="#0f1c3f">SATI</text>

  <!-- Tagline -->
  <text x="200" y="284" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="15" letter-spacing="2.2" fill="#1d4ed8">SERVICIOS ASESORÍAS</text>
  <text x="200" y="304" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="600" font-size="15" letter-spacing="2.2" fill="#1d4ed8">TECNOLOGÍA INFORMÁTICA</text>
</svg>
