name: Actualizar SATI Clima

on:
  schedule:
    - cron: "17 10 * * *"   # todos los días 10:17 UTC (07:17 hora Chile en verano, 06:17 en invierno)
  workflow_dispatch: {}      # botón "Run workflow" para correrlo a mano

permissions:
  contents: write

concurrency:
  group: clima
  cancel-in-progress: false

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Descargar corrida GFS y regenerar clima.html
        run: node scripts/actualizar-clima.mjs clima.html

      - name: Guardar cambios en el repositorio
        run: |
          if git diff --quiet -- clima.html; then
            echo "Sin cambios."
            exit 0
          fi
          git config user.name  "sati-clima-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clima.html
          git commit -m "Clima: corrida GFS $(date -u +%Y-%m-%dT%HZ)"
          git push
